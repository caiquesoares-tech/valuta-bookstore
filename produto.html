<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valuta - Detalhes do Livro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@900&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css?v=1.5">
</head>
<body class="pagina-produto">

    <header class="main-header">
        <div class="container navbar">
            <div class="nav-links-left">
                <a href="index.html">Início</a>
            </div>

            <a href="index.html" class="brand">
                <span class="logo-destaque">V</span><span class="logo-texto">aluta</span>
                <span class="subtitle">Bookstore</span>
            </a>

            <div class="nav-icons-right">
                <a href="carrinho.html" class="cart-link">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" id="contagem-carrinho">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="produto-detalhe-section">
            <div class="produto-container">
                <div class="produto-imagem-foco">
                    <img id="detalhe-imagem" src="" alt="Capa do Livro">
                </div>

                <div class="produto-info-foco">
                    <span class="slide-tag">EDIÇÃO COLECIONADOR</span>
                    <h1 id="detalhe-titulo" class="detalhe-titulo-principal"></h1>
                    
                    <p class="produto-autor-link">
                        Por <span id="detalhe-autor"></span>
                    </p>
                    
                    <div class="descricao-area">
                        <p id="detalhe-sinopse" class="sinopse-texto"></p>
                    </div>
                    
                    <div class="compra-acao-area">
                        <div class="preco-container">
                            <span class="label-preco">valor</span>
                            <span class="preco-grande" id="detalhe-preco"></span> 
                        </div>
                        
                        <button id="btn-add-detalhe" class="btn-comprar-grande">
                            ADICIONAR AO CARRINHO
                            <i class="fas fa-shopping-bag"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="secao-autor-premium">
            <div class="container">
                <div class="autor-card">
                    <div class="autor-foto-column">
                        <img id="autor-foto" src="" alt="Foto do Autor">
                    </div>
                    <div class="autor-texto-column">
                        <h3 class="autor-label">SOBRE O AUTOR</h3>
                        <h4 id="autor-nome-info" class="autor-nome-titulo"></h4>
                        <p id="autor-bio" class="autor-biografia"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="container recomendacoes-section">
            <div class="section-header">
                <h2>Outras Obras que Podem lhe Interessar</h2>
                <div class="decorative-line"></div>
            </div>
            
            <div class="carrossel-wrapper" style="position: relative;">
                <button class="arrow-btn prev" onclick="scrollManual(-1)">&#10094;</button>
                <div id="vitrine-recomendacoes" class="livros-grid-carrossel"></div>
                <button class="arrow-btn next" onclick="scrollManual(1)">&#10095;</button>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-links-wrapper">
                <div class="footer-item"><i class="fa-brands fa-instagram"></i> <span>@Valutabookstoreoficial</span></div>
                <div class="footer-item"><i class="fa-solid fa-envelope"></i> <span>contato@valutabookstore.com</span></div>
                <div class="footer-item"><i class="fa-solid fa-phone"></i> <span>(xx) 99899-218X</span></div>
            </div>
            <div class="footer-divisor"></div>
            <div class="footer-bottom">
                <p>Valuta Bookstore &copy; 2026</p>
                <p class="footer-credito">Desenvolvido por <strong>Caique Soares</strong> - ADS</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="produto.js"></script>
</body>
</html>
